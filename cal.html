<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cal.css">
</head>
<body>
    <div class="container">
        <div class="cal">
            <div  class="space">
                <input  id="display" readonly>
            </div>
            <div id="button" class="buttons">
                <button class="style" onclick="clearDisplay('ac')" >ac</button>
                <button onclick="deleteLast('<=')" class="style"><=</button>
                <button onclick="appendToDisplay('+/-')" class="style">+/-</button>
                <button onclick="appendToDisplay('/')" class="style">/</button>
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button onclick="appendToDisplay('*')" class="style">*</button>
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button onclick="appendToDisplay('-')" class="style">-</button>
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button onclick="appendToDisplay('+')" class="style">+</button>
                <button onclick="appendToDisplay('%')" class="style">%</button>
                <button onclick="appendToDisplay('0')">0</button>
                <button onclick="appendToDisplay('.')" class="style">.</button>
                <button class="green" onclick="calculate('=')" >=</button>
            </div>
    

        </div>
    </div>
    <!-- connection of javascript-->
     <script src="calfunction.js"></script>
</body>
</html>
